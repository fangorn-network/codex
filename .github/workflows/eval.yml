# check's hit/near/miss against live codex: on every push (a threshold or label change), and daily,
# since publishers add findings without a deploy and new findings can turn a near into a false hit.
name: eval
on:
  push:
  pull_request:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test   # URL mode needs no dependencies
